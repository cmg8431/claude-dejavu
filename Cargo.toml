[workspace]
resolver = "2"
members = [
    "crates/dejavu-core",
    "crates/dejavu-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["cmg8431"]
license = "MIT"
repository = "https://github.com/cmg8431/claude-dejavu"

[workspace.dependencies]
dejavu-core = { path = "crates/dejavu-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
colored = "3"
dirs = "6"
anyhow = "1"
walkdir = "2"
glob = "0.3"
regex = "1"
similar = "2"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true
